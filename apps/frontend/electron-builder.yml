appId: com.electron.app
productName: frontend
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!build/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  - "!**/*.{map,md,markdown,ts,tsx,flow}"
  - "!**/{test,tests,__tests__,spec,example,examples,docs,doc,.github,.idea}/**"
  - "!**/{LICENSE,LICENSE.*,AUTHORS,CONTRIBUTORS,.eslintrc*,.editorconfig,.travis.yml}"
asar: true
compression: maximum
removePackageScripts: true
removePackageKeywords: true
# Ship only English. Every extra locale costs ~200 KB in the framework bundle;
# the full set is ~48 MB.
electronLanguages:
  - en-US
afterPack: build/afterPack.cjs
asarUnpack:
  - resources/**
win:
  executableName: frontend
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # dmg only. Adding `zip` here doubles dist output and is only needed if you
  # wire up Squirrel.Mac auto-updates (see KEEP_AUTOUPDATER in build/afterPack.cjs).
  target:
    - dmg
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  # AppImage only. `snap` bundles a runtime and roughly doubles output; `deb`
  # ships a second uncompressed copy of the same tree.
  target:
    - AppImage
  executableName: frontend
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
